font-family = "Intone Mono Nerd Font"
font-size = 18

cursor-style = block
mouse-hide-while-typing = true

confirm-close-surface = false

# Send Option+key as Alt/Meta (ESC-prefixed) instead of macOS special
# characters, so tmux's `-n M-h/j/k/l` and `M-1..9` bindings work like on WSL.
macos-option-as-alt = true
