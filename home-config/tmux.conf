# set default terminal
set -g default-terminal screen-256color

# Ensure SSH_CONNECTION is refreshed from the attaching client on every
# attach, not just frozen from whichever session first started the server.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# enable true colors for term gui
set -ga terminal-overrides ",*-256color:Tc"

# For older terminals use below for true colors
# set-option -a terminal-features 'screen-256color:Tc'

# set -g utf8 on
# set -g status-utf8 on

set-option -g bell-action none
set-option -g visual-bell off

# start window index form 1 (consistent with keyboard)
set -g base-index 1

# start window index form 1 to keep it consistent with window
setw -g pane-base-index 1

# automatically renumber windows when one is closed to keep numbers small
set -g renumber-windows on

# windows with activity are highlighted
setw -g monitor-activity on

# increase scrollback lines
set -g history-limit 20000

# set-option -g set-clipboard "on"

#########################################
# KEYBINDINGS
#########################################

# split panes and create windows in $PWD
bind h split-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# set tmux to Vi mode
set-window-option -g mode-keys vi

# scroll up/down with j/k
bind-key -T copy-mode-vi j send-keys -X page-down
bind-key -T copy-mode-vi k send-keys -X page-up

bind-key -T copy-mode-vi WheelUpPane send-keys -X page-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X page-down

# bind-key -T copy-mode-vi WheelUpPane send-keys -X halfpage-up
# bind-key -T copy-mode-vi WheelDownPane send-keys -X halfpage-down

# bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
# bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# v for selection y for yanking
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+


# switch windows alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

#####################################################
##### START : christoomey/vim-tmux-navigator : START
#####################################################

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# NOTE: There's an issue with latest tmux + vim.
# https://github.com/christoomey/vim-tmux-navigator/issues/294#issuecomment-841582996
# https://github.com/christoomey/vim-tmux-navigator?tab=readme-ov-file#switching-between-host-panes-doesnt-work-when-docker-is-running
if-shell '[ -f /.dockerenv ]' \
  "is_vim=\"ps -o state=,comm= -t '#{pane_tty}' \
      | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'\""
  # Filter out docker instances of nvim from the host system to prevent
  # host from thinking nvim is running in a pseudoterminal when its not.
  "is_vim=\"ps -o state=,comm=,cgroup= -t '#{pane_tty}' \
      | grep -ivE '^.+ +.+ +.+\\/docker\\/.+$' \
      | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)? +'\""

bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-y' select-pane -l

#################################################
##### END : christoomey/vim-tmux-navigator : END
#################################################

######################################### 
# PLUGINS
######################################### 

# Install tmux plugin manager and plugins automatically when tmux starts
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# statusline
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'everforest'

# SSH_CONNECTION is refreshed by tmux on every client attach (see
# update-environment), so drive the tag from a live format ternary instead of
# an if-shell, which only ever runs once when the tmux server first boots.
set -g @tmux_power_left_a ' #{?SSH_CONNECTION,REMOTE ,}#{USER}@#h '
set -g @tmux_power_date_format '%d-%m-%g  '
# set -g @tmux_power_time_format '%T'

# Mirror the same signal in the terminal tab/window title.
set -g set-titles on
set -g set-titles-string '#{?SSH_CONNECTION,[REMOTE] ,}#h:#S'

# Extra-visible pane borders on remote sessions only. Unlike status-line
# options, pane-border-style/pane-active-border-style don't support #{} format
# expansion (literal styles only, per `man tmux`), so drive them from a hook
# that re-evaluates SSH_CONNECTION on every attach instead. Attributes (bold)
# are also ignored on these two options, so only fg is set.
set-hook -g client-attached "if-shell -F '#{SSH_CONNECTION}' \
  'set -g pane-active-border-style fg=colour160; set -g pane-border-style fg=colour52' \
  'set -g pane-active-border-style fg=colour39; set -g pane-border-style fg=colour238'"

# Keep command runners in the normal pane buffer instead of switching
# applications into the alternate screen.
set -ga terminal-overrides ",*:smcup@:rmcup@"
set -g alternate-screen off

# always put at the end of .tmux.conf
run -b '~/.tmux/plugins/tpm/tpm'
